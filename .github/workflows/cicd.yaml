# github repository actions 페이지에 나타날 이름
name: CI/CD using github actions & docker

# event trigger
on:
  push:
    branches: [ "feat/#73-apple-login" ]

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:

      # JDK setting
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle caching - 빌드 시간 향상
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make application.yaml
        run: |
          mkdir -p ./src/main/resources
          cd ./src/main/resources
          touch ./application.yaml
            echo "${{ secrets.APPLICATION_YAML }}" > ./application.yaml
          
          touch ./application-dep.yaml
            echo "${{ secrets.APPLICATION_DEP_YAML }}" > ./application-dep.yaml
        
          touch ./application-jwt.yaml
            echo "${{ secrets.APPLICATION_JWT_YAML }}" > ./application-jwt.yaml
        
          touch ./application-oauth.yaml
            echo "${{ secrets.APPLICATION_OAUTH_YAML }}" > ./application-oauth.yaml
          
          touch ./application-aws.yaml
            echo "${{ secrets.APPLICATION_AWS_YAML }}" > ./application-aws.yaml
        
     

        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ec92e829475ac0c2315ea8f9eced72db85bb337a # v3.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build -x test --no-build-cache

      - name: Docker build & Push
        run: |
          docker login -u ${{ secrets.DOCKER_ID }} -p ${{ secrets.DOCKER_PASSWORD }}
          
          docker build --no-cache -t ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_REPO_NAME }} .
          
          docker run -d \
            -e JASYPT_PASSWORD=${{ secrets.JASYPT_PASSWORD }} \
            -p 8080:8080 \
            ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_REPO_NAME }}
          docker push ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_REPO_NAME }}

      ## deploy to develop
      - name: Deploy docker
        uses: appleboy/ssh-action@master
        id: deploy-docker
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: 22
          script: |
            sudo docker ps
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_ID }}" --password-stdin
            sudo docker pull ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_REPO_NAME }}
            chmod 777 ./deploy.sh
            ./deploy.sh
            sudo docker image prune -f